- insert:
    - id: dsh-novel-readnest
      name: dsh-novel-readnest
    - id: preset-readest-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: readest-companion
        name: 小说陪读
        description: 仅使用当前书籍的阅读工具讨论小说
        plugins:
          - id: novel-native-tools
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
          - id: novel-reader-tool
            name: dsh-novel-readnest/agent
          - id: companion-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: tool-result-pruner
                name: dsh-novel-readnest/pruner
                config:
                  thresholdChars: 6000
                  headChars: 1200
                  tailChars: 600
              - id: compaction-basic
                name: dsh-novel-readnest/compaction
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
